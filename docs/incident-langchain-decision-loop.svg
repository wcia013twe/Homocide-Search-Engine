<svg xmlns="http://www.w3.org/2000/svg" width="1810" height="1020" viewBox="0 0 1810 1020"><defs><marker id="arrow-4f5d75" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4f5d75"/></marker><marker id="arrow-2e5aa8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><polyline points="210,305 210,365" fill="none" stroke="#4f5d75" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow-4f5d75)"/><polyline points="340,435 420,435" fill="none" stroke="#4f5d75" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow-4f5d75)"/><polyline points="680,435 760,435" fill="none" stroke="#4f5d75" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow-4f5d75)"/><polyline points="1020,435 1100,435" fill="none" stroke="#4f5d75" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow-4f5d75)"/><polyline points="1230,520 1230,615" fill="none" stroke="#4f5d75" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow-4f5d75)"/><polyline points="1100,690 1020,690" fill="none" stroke="#4f5d75" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow-4f5d75)"/><polyline points="760,690 680,690" fill="none" stroke="#4f5d75" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow-4f5d75)"/><polyline points="420,690 340,690" fill="none" stroke="#4f5d75" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow-4f5d75)"/><polyline points="550,520 550,542" fill="none" stroke="#4f5d75" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arrow-4f5d75)"/><polyline points="550,615 550,590 890,590 890,520" fill="none" stroke="#4f5d75" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow-4f5d75)"/><polyline points="500,770 500,825 35,825 35,435 80,435" fill="none" stroke="#4f5d75" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow-4f5d75)"/><polyline points="550,365 550,255 1600,255 1600,365" fill="none" stroke="#2e5aa8" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arrow-2e5aa8)"/><polyline points="1360,690 1410,690 1410,580 1460,580" fill="none" stroke="#2e5aa8" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arrow-2e5aa8)"/><text x="65" y="67" font-family="Arial,sans-serif" font-size="32" fill="#2d3142" font-weight="700"><tspan x="65" dy="0">Incident research: two decisions, one controlled loop</tspan></text><text x="65" y="108" font-family="Arial,sans-serif" font-size="18" fill="#4f5d75" ><tspan x="65" dy="0">LangChain handles model/tool calls. LangGraph carries state and follows routes defined in code.</tspan></text><text x="65" y="157" font-family="Arial,sans-serif" font-size="14" fill="#4f5d75" ><tspan x="65" dy="0">ORANGE  decision judgments     •     WHITE  tools / code     •     BLUE DASHED  Decision API calls</tspan></text><rect x="80" y="205" width="260" height="100" rx="7" fill="#ffffff" stroke="#4f5d75" stroke-width="1.3"/><g transform="translate(98,223) scale(1.125)" fill="none" stroke="#4f5d75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></g><text x="137" y="242" font-family="Arial,sans-serif" font-size="18" fill="#2d3142" font-weight="700"><tspan x="137" dy="0">Seed record</tspan></text><text x="98" y="281" font-family="Arial,sans-serif" font-size="15" fill="#4f5d75" ><tspan x="98" dy="0">Name + affiliation / city / date</tspan></text><rect x="80" y="365" width="260" height="155" rx="7" fill="#ffffff" stroke="#4f5d75" stroke-width="1.3"/><g transform="translate(98,383) scale(1.125)" fill="none" stroke="#4f5d75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></g><text x="137" y="402" font-family="Arial,sans-serif" font-size="18" fill="#2d3142" font-weight="700"><tspan x="137" dy="0">1  Get search leads</tspan></text><text x="98" y="441" font-family="Arial,sans-serif" font-size="15" fill="#4f5d75" ><tspan x="98" dy="0">Exa or Brave adapter</tspan><tspan x="98" dy="21.75">Save query + returned results</tspan><tspan x="98" dy="21.75">Replay: use saved SQLite rows</tspan></text><rect x="420" y="365" width="260" height="155" rx="7" fill="#f8e9e3" stroke="#bf4520" stroke-width="2"/><g transform="translate(438,383) scale(1.125)" fill="none" stroke="#bf4520" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18m0-12h9a5 5 0 0 0 5-5m-14 9h9a5 5 0 0 1 5 5"/><circle cx="19" cy="3" r="2"/><circle cx="19" cy="20" r="2"/></g><text x="477" y="402" font-family="Arial,sans-serif" font-size="18" fill="#2d3142" font-weight="700"><tspan x="477" dy="0">2  Worth reading?</tspan></text><text x="438" y="441" font-family="Arial,sans-serif" font-size="15" fill="#4f5d75" ><tspan x="438" dy="0">Input: identifiers + gaps</tspan><tspan x="438" dy="21.75">Title + URL + short excerpt</tspan><tspan x="438" dy="21.75">Output: read / reject + scores</tspan></text><rect x="760" y="365" width="260" height="155" rx="7" fill="#ffffff" stroke="#4f5d75" stroke-width="1.3"/><g transform="translate(778,383) scale(1.125)" fill="none" stroke="#4f5d75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5C8 2 4 3 2 4v15c4-2 7-1 10 1 3-2 6-3 10-1V4c-3-1-7-2-10 1Zm0 0v15"/></g><text x="817" y="402" font-family="Arial,sans-serif" font-size="18" fill="#2d3142" font-weight="700"><tspan x="817" dy="0">3  Read source</tspan></text><text x="778" y="441" font-family="Arial,sans-serif" font-size="15" fill="#4f5d75" ><tspan x="778" dy="0">Fetch only selected URLs</tspan><tspan x="778" dy="21.75">Replay: saved excerpts only</tspan><tspan x="778" dy="21.75">Keep source text + provenance</tspan></text><rect x="1100" y="365" width="260" height="155" rx="7" fill="#ffffff" stroke="#4f5d75" stroke-width="1.3"/><g transform="translate(1118,383) scale(1.125)" fill="none" stroke="#4f5d75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 7h8M8 12h8M8 17h5"/></g><text x="1157" y="402" font-family="Arial,sans-serif" font-size="18" fill="#2d3142" font-weight="700"><tspan x="1157" dy="0">4  Extract claims</tspan></text><text x="1118" y="441" font-family="Arial,sans-serif" font-size="15" fill="#4f5d75" ><tspan x="1118" dy="0">LLM: candidate field values</tspan><tspan x="1118" dy="21.75">Supporting passages + URLs</tspan><tspan x="1118" dy="21.75">Keep conflicting claims</tspan></text><rect x="1100" y="615" width="260" height="155" rx="7" fill="#f8e9e3" stroke="#bf4520" stroke-width="2"/><g transform="translate(1118,633) scale(1.125)" fill="none" stroke="#bf4520" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18m0-12h9a5 5 0 0 0 5-5m-14 9h9a5 5 0 0 1 5 5"/><circle cx="19" cy="3" r="2"/><circle cx="19" cy="20" r="2"/></g><text x="1157" y="652" font-family="Arial,sans-serif" font-size="18" fill="#2d3142" font-weight="700"><tspan x="1157" dy="0">5  Supported value?</tspan></text><text x="1118" y="691" font-family="Arial,sans-serif" font-size="15" fill="#4f5d75" ><tspan x="1118" dy="0">Input: claims + supporting text</tspan><tspan x="1118" dy="21.75">Output: fill / leave empty + scores</tspan><tspan x="1118" dy="21.75">Primary source is helpful, optional</tspan></text><rect x="760" y="615" width="260" height="155" rx="7" fill="#ffffff" stroke="#4f5d75" stroke-width="1.3"/><g transform="translate(778,633) scale(1.125)" fill="none" stroke="#4f5d75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m8 5-6 7 6 7m8-14 6 7-6 7m-3-16-2 20"/></g><text x="817" y="652" font-family="Arial,sans-serif" font-size="18" fill="#2d3142" font-weight="700"><tspan x="817" dy="0">6  Fill + find gaps</tspan></text><text x="778" y="691" font-family="Arial,sans-serif" font-size="15" fill="#4f5d75" ><tspan x="778" dy="0">Fill supported values immediately</tspan><tspan x="778" dy="21.75">Keep URL + passage + scores</tspan><tspan x="778" dy="21.75">Gaps = missing or conflicting</tspan></text><rect x="420" y="615" width="260" height="155" rx="7" fill="#ffffff" stroke="#4f5d75" stroke-width="1.3"/><g transform="translate(438,633) scale(1.125)" fill="none" stroke="#4f5d75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m8 5-6 7 6 7m8-14 6 7-6 7m-3-16-2 20"/></g><text x="477" y="652" font-family="Arial,sans-serif" font-size="18" fill="#2d3142" font-weight="700"><tspan x="477" dy="0">7  Choose next step</tspan></text><text x="438" y="691" font-family="Arial,sans-serif" font-size="15" fill="#4f5d75" ><tspan x="438" dy="0">Code: unread useful source first</tspan><tspan x="438" dy="21.75">Else query for remaining gap</tspan><tspan x="438" dy="21.75">Track attempts for each gap</tspan></text><rect x="80" y="615" width="260" height="155" rx="7" fill="#ffffff" stroke="#4f5d75" stroke-width="1.3"/><g transform="translate(98,633) scale(1.125)" fill="none" stroke="#4f5d75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22V3c5-5 9 5 15 0v11c-6 5-10-5-15 0"/></g><text x="137" y="652" font-family="Arial,sans-serif" font-size="18" fill="#2d3142" font-weight="700"><tspan x="137" dy="0">8  Finish this pass</tspan></text><text x="98" y="691" font-family="Arial,sans-serif" font-size="15" fill="#4f5d75" ><tspan x="98" dy="0">Required fields filled OR</tspan><tspan x="98" dy="21.75">attempt / no-progress limit hit</tspan><tspan x="98" dy="21.75">Keep unresolved fields explicit</tspan></text><rect x="1460" y="365" width="280" height="345" rx="7" fill="#ffffff" stroke="#4f5d75" stroke-width="1.3"/><g transform="translate(1478,383) scale(1.125)" fill="none" stroke="#4f5d75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="7" rx="2"/><rect x="2" y="14" width="20" height="7" rx="2"/><path d="M6 6h1m-1 11h1m5-11h6m-6 11h6"/></g><text x="1517" y="402" font-family="Arial,sans-serif" font-size="18" fill="#2d3142" font-weight="700"><tspan x="1517" dy="0">Databricks ai_decide</tspan></text><text x="1478" y="441" font-family="Arial,sans-serif" font-size="15" fill="#4f5d75" ><tspan x="1478" dy="0">One API, two judgment tasks</tspan><tspan x="1478" dy="21.75"></tspan><tspan x="1478" dy="21.75">A  Source value: read / reject</tspan><tspan x="1478" dy="21.75">B  Data: fill / leave empty</tspan><tspan x="1478" dy="21.75"></tspan><tspan x="1478" dy="21.75">Responses: choices + scores</tspan><tspan x="1478" dy="21.75">No pending-verification status</tspan><tspan x="1478" dy="21.75"></tspan><tspan x="1478" dy="21.75">Catalog: system.ai.ai_decide</tspan><tspan x="1478" dy="21.75">Present; execution probes failed</tspan></text><text x="430" y="558" font-family="Arial,sans-serif" font-size="13" fill="#4f5d75" ><tspan x="430" dy="0">reject = skip this pass</tspan><tspan x="430" dy="18.849999999999998">Retain result for reconsideration</tspan></text><rect x="80" y="880" width="1280" height="100" rx="7" fill="#ffffff" stroke="#4f5d75" stroke-width="1.3"/><g transform="translate(98,898) scale(1.125)" fill="none" stroke="#4f5d75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 4 18 4 18 0V5M3 12c0 4 18 4 18 0"/></g><text x="137" y="917" font-family="Arial,sans-serif" font-size="18" fill="#2d3142" font-weight="700"><tspan x="137" dy="0">Audit trail / SQLite + saved artifacts</tspan></text><text x="98" y="956" font-family="Arial,sans-serif" font-size="15" fill="#4f5d75" ><tspan x="98" dy="0">Record every stage: inputs, source IDs, rubric version, decisions, scores, actions and per-gap search attempts.</tspan></text><text x="1460" y="814" font-family="Arial,sans-serif" font-size="14" fill="#4f5d75" ><tspan x="1460" dy="0">PROPOSED DESIGN</tspan><tspan x="1460" dy="20.3">Replay test: saved Padmini results.</tspan><tspan x="1460" dy="20.3">No new searches or deployment.</tspan><tspan x="1460" dy="20.3">Supported values fill immediately.</tspan><tspan x="1460" dy="20.3">Keep all conflicting source claims.</tspan></text><rect x="224" y="322" width="44" height="24" fill="#f5f5f5"/><text x="246" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#4f5d75">seed</text><rect x="685" y="404" width="44" height="24" fill="#f5f5f5"/><text x="707" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#4f5d75">read</text><rect x="1240" y="557" width="58" height="24" fill="#f5f5f5"/><text x="1269" y="573" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#4f5d75">claims</text><text x="1026" y="669" font-family="Arial,sans-serif" font-size="12" fill="#4f5d75" ><tspan x="1026" dy="0">update</tspan></text><rect x="344" y="654" width="44" height="24" fill="#f5f5f5"/><text x="366" y="670" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#4f5d75">stop</text><rect x="637" y="576" width="198" height="24" fill="#f5f5f5"/><text x="736" y="592" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#4f5d75">useful source still unread</text><rect x="90" y="792" width="457" height="24" fill="#f5f5f5"/><text x="318.5" y="808" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#4f5d75">gap + budget: generate query, deduplicate, search_attempts += 1</text><rect x="790" y="243" width="254" height="24" fill="#f5f5f5"/><text x="917" y="259" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#2e5aa8">A: classify leads / return choices</text><rect x="1378" y="647" width="23" height="24" fill="#f5f5f5"/><text x="1389.5" y="663" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#2e5aa8">B</text><text x="80" y="1003" font-family="Arial,sans-serif" font-size="13" fill="#4f5d75" ><tspan x="80" dy="0">Audit applies to every stage. API failure pauses the pass and records an error; it never becomes a read/reject or fill decision.</tspan></text></svg>