command: ['streamlit', 'run', 'app.py', '--server.address', '0.0.0.0', '--server.port', '$DATABRICKS_APP_PORT']
env:
  - name: STREAMLIT_GATHER_USAGE_STATS
    value: 'false'
  - name: HR_REQUIRE_PROXY_IDENTITY
    value: 'true'
  - name: HR_DATA_DIR
    value: '/tmp/homicide-research'
  - name: BRAVE_API_KEY
    valueFrom: brave_secret
  - name: EXA_API_KEY
    valueFrom: exa_secret
